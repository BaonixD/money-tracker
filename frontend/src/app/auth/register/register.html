<div class="auth-container">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="auth-subtitle">Start tracking your finances</p>

    @if (error) {
      <div class="error-msg">{{ error }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Your name" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="your@email.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary">Register</button>
    </form>

    <p class="auth-link">Already have an account? <a routerLink="/login">Sign In</a></p>
  </div>
</div>
